- id: benslamaSubjectiveImpactJihadist2016
  abstract: The jihadist radicalismcan represent an important factor in relationship with the process of subjectivation, identification, de-idealization and re-idealization of adolescents or young adults today. This contribution focuses on the phenomenon of radicalization in France and on its clinical aspects, on the basis of the data collected by the Ministry of Internal Affairs in 2015. It aims to understand the sources of radicalisation, showing that many of the candidates for jihad are getting younger and younger, belong to all social classes and constitute a heterogeneous whole, including the element of “prolonged adolescence” into a factorial multiplicity. In this perspective it is possible to measure the function of ideals in juvenile temporality, to interpret the clinically corroborated data according to it and to analyse the power of collecting negativity that characterizes jihadist radicalism around the world at present.
