- id: riedenauerFundamentalismusAlsKritische2016
  abstract: Religious fundamentalists think that the basis of their religion and possibly of society is missing. While what they construct and propose as the definite fundament seems less convincing, the diagnosis might contain some truth. Modern atheism, too, is seen as a consequence of an erosion of the fundament or roots, the general outlines of which are the topic of philosophical theology. If both fundamentalismand atheism are critical reactions to a lack of basis, the field of philosophical theology needs to be examined, researching the fate of the fundament. The article proposes hypotheses to this end, like archeologists conduct a test excavation.
