- id: ackermannCharismaNetzwerkBraco2015
  abstract: Charisma, verstanden als die Zuschreibung des Außergewöhnlichen, ist ein rein relationales Konstrukt. Die Beschreibung einer Person oder eines Dings als charismatisch ist dieser Definition entsprechend irreführend. Der wissenschaftliche Diskurs über Charisma stolpert allerdings bis anhin noch über diesen sprachlichen Stein. Somit blieben auch nach der seit Weber geforderten Relationalisierung des Konzepts Sinnartefakte anderer Charisma-Diskurse bestehen. Mithilfe der Perspektive der sozialen Netzwerkanalyse sollen diese Begrifflichkeiten in folgenden Beitrag geschärft und das Charisma-Konzept erweitert werden. Anstatt von charismatischen Akteuren zu sprechen, schlage ich vor nur noch Beziehungen und Netzwerke charismatisch, Akteure hingegen charismatisiert oder charismatisierend zu nennen. Am Beispiel des Heilers Braco wird dieser Vorschlag demonstriert, gezeigt wie sich Charisma-Netzwerke über Zuschreibungsprozesse konstituieren und verbreiten und wie die Strukturlogik von Events die Charismatisierung normativieren.
