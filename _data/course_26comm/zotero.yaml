- id: jacksonRoutledgeHandbookLanguage2020
  abstract: "The Routledge Handbook of Language and Intercultural Communication provides a comprehensive historical survey of language and intercultural communication studies with a critical assessment of past and present theory, research, and practice, as well as an insight into future directions.\nDrawing on the expertise of leading scholars from different parts of the world, this second edition offers updated chapters by returning authors and many new contributions on a broad range of topics, including reflexivity and criticality, translanguaging, and social justice in relation to intercultural communication.With an emphasis on contemporary, critical perspectives, this handbook showcases the varied range of issues, perspectives, and approaches that characterise this increasingly important field in today’s globalised world.\nOffering 34 chapters with examples from a variety of languages and international settings, this handbook is an indispensable resource for students and scholars working in the fields of intercultural communication, applied linguistics, TESOL/ TEFL, and communication studies."
