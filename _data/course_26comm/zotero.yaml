- id: thomasShortFormCultural2017
  abstract: "The short form cultural intelligence scale\n(SFCQ) is a theory-based, short measure of cultural intelligence that captures\nthe original theoretical intent of a multifaceted culture general form of\nintelligence that is related to effective intercultural interactions. Validity\nis established with 3526 participants in five language groups. Results provide\nevidence for construct and criterion-related validity of the measure, and\nindicate that cultural intelligence is a single latent factor reflected in\nthree intermediate facets of cross cultural knowledge, skills and cultural\nmetacognition. The measure is modestly related to but distinct from emotional\nintelligence and personality, and it correlates positively with several\nindicators of multicultural experience. It relates as predicted to several\ndimensions of inter-cultural effectiveness."
