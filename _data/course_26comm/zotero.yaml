- id: fuchsChallengedSenseBelonging2022
  abstract: 'The sense of belonging as well as challenges to this sense are important, albeit neglected aspects of social integration and of significance to migration and refugee studies as well as to virtually all other social science contexts. Assessing a challenged or eroded sense of belonging provides important insights into how individuals relate to their environment and whether they feel socially connected or disconnected from it. The construct goes beyond national or cultural identity, instead emphasizing the dynamic processes of emotional attachment. Reviewing the substantial theoretical literature on be-longing, we identify four of its key elements: connection, participation, identification, and congruence. Drawing on existing measurement instruments, a brief Challenged Sense of Belonging Scale (CSBS) is proposed that addresses each of the four elements and investigate its validity in a unique, multi-lingual random sample of 3783 adult refugees in Germany from various national and cultural back-grounds. Evidence for the scale’s validity is provided separately for three main survey languages (English, Arabic, Farsi/Dari) using confirmatory factor analysis, a test of measurement invariance, item test and rest correlations, and correlation analysis to explore convergent validity. The findings suggest that the scale is a suitable instrument for the assessment of a challenged sense of belonging in a heterogeneous population of refugees.'
