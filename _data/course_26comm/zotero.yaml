- id: caiNavigatingInterculturalConflict2025
  abstract: Although much attention has been given in recent years to improving diversity, equity, inclusion, and belonging (DEIB), small differences in communication behaviours can undermine these efforts. This chapter considers how small differences in the way people communicate can affect perceptions of others, and consequently, how intercultural conflict relates to efforts to improve DEIB. Negative responses toward other people can result from implicit attitudes toward and reactions to cultural differences in communication styles. Perceptions of escalating conflict can arise from differences in how people communicate, even when there is no conflict over substantive issues. These perceptions can attenuate efforts to include people from diverse backgrounds if they are viewed as difficult to work with. Therefore, learning to appreciate diversity in the ways people communicate is important in order to move beyond negative judgements and toward appreciating the diverse perspectives and communication styles people bring to the table.
