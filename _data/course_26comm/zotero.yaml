- id: littlerReligionInterculturalCommunication2020
  abstract: Margaret Littler adopts a critical approach to the understanding of religion as an object of intercultural knowledge, diverging from a view of religion as a set of codified and culturally specific practices, and proposing instead an appreciation of the transformative nature of faith as a dynamic potentiality within life. Her chapter, which draws on ideas relating to the power of narratives and memory, argues for a non-representational approach to literary texts, in which religion is not only content or theme, but a source of creative intensity that erupts into a settled understanding of religious orthodoxies. The chapter focuses on German-language texts that engage creatively with religion, making of it an emergent phenomenon with the potential to unsettle and expand the dominant images of Islam and Christianity circulating in Europe today. Drawing on Deleuze and Guattari’s concept of minor literature, it seeks to demonstrate how a non-representational reading of texts opens up unexpected perspectives rather than representing what is already known.
