- id: guenesMachtImInterreligioesen2022
  abstract: '"Dialog" gilt allgemein als anerkanntes Ziel interreligiöser Begegnungen. Bei Schwierigkeiten und Konflikten wird rasch zur Intensivierung des Dialogs aufgerufen. Doch verdient das "Dispositiv Dialog" einen genauen Blick; es steht nicht über den Konflikten und jenseits der Interessen: Wer bestimmt die Gestaltung und die Ziele von Dialogen? Welche Bedeutung hat die unterschiedliche Verteilung von Diskurspositionen, Interessen, Geldern, Publikationsmöglichkeiten? Und wie steht es um den Einfluss der Vorverständnisse von "Religion", "Vernunft und Verständigung" und "Gesellschaft"? Diesen eindeutigen Machtfragen gehen Wissenschaftlerinnen und Wissenschaftler aus den Bereichen Theologie, Religionswissenschaft, Philosophie, Pädagogik und Soziologie nach. Der Blick auf den europäischen Kontext wird ergänzt durch Beiträge aus afrikanischer und asiatischer Sicht.'
