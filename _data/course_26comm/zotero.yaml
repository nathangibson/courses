- id: dellerVerfahrenUndAnsaetze2007
  abstract: In einem fortschreitenden Prozess führt die zunehmende Liberalisierung des Welthandels und internationale Ausrichtung einzelner Organisationen sowie die weltweite Vernetzung der Gesellschaften dazu, dass immer mehr Menschen für unterschiedliche Dauer im Ausland leben oder im Inland mit Personen anderer Nationalität Kontakt haben. Aufgrund dieser Entwicklung wird die Fähigkeit, mit der Andersartigkeit verschiedener Kulturen umzugehen, in Gesellschaft und Organisationen immer wichtiger.
