- id: smithTheoreticalLandscapeIntercultural2025
  abstract: Theorising in the field of intercultural communication has proliferated since the 1983 volume of the International and Intercultural Communication Annual charted the nascent discipline's early conceptual pathways. The refinement of Karl Popper's (1965) nets that catch the world could not be truer of intercultural scholarship. Progress over the past 40 years has been marked by increasing conceptual sophistication, contextual application, and expansion into virtually every philosophical and methodological sector of communication studies. This chapter provides an overview of current intercultural communication theories within two of the established quantitative-analytical-deductive traditions used to explain intercultural phenomena. The chapter provides summaries of selected theories, highlighting key assumptions that guide propositions for the latest versions of established theories. I offer an assessment of each theory and highlight areas of growth resulting from emerging theories, as well as signal points of dormancy and potential that have appeared during the past two decades. The prospect for increasingly interdisciplinary, innovative, and insightful theoretical conversations hints that the mesh of our theoretical landscape is becoming ever finer.
