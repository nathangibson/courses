- id: straubKultur2007
  abstract: Die Ausdrücke ›interkulturelle Kommunikation‹ und ›interkulturelle Kompetenz‹ sind semantisch komplex und logisch voraussetzungsvoll. Ihre Analyse verlangt eine Beschäftigung mit den Bestandteilen, aus denen sie sich zusammensetzen. Dazu gehört in beiden Fällen das adjektivische Determinativkompositum, das sich aus den Gliedern ›inter‹ (dem Determinatum) und ›kulturell‹ (dem Determinans) zusammensetzt. Wer die Bedeutung dieses zusammengesetzten Adjektivs klären möchte, muss sich mit dem dazu gehörenden Substantiv ›Kultur‹, seiner Etymologie und Entwicklung bis in die jüngste Zeit befassen. Dieses Nomen ist fundamental, wo immer es um ›kulturelle‹ Sachverhalte jedweder Art geht. Seine denotativen und konnotativen Bedeutungen bestimmen in entscheidender Weise mit, wovon in den im vorliegenden Handbuch interessierenden Diskursen und Praxisfeldern eigentlich die Rede ist. Ein klarer Begriff interkultureller Kommunikation und Kompetenz erfordert also zunächst einmal eine historisch-systematisch angelegte Analyse des Nomens ›Kultur‹.
