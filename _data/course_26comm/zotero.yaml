- id: koesterBehavioralAssessmentScale1988
  abstract: "The behavioral approach to the measurement of intercultural communication effectiveness is used as the theoretical and methodological basis for the development of the Behavioral Assessment Scale for Intercultural Communication (BASIC) effectiveness. The prior work of Ruben and his colleagues is described. The conceptual strengths and methodological weaknesses of this approach are presented. Modifications of the original nine Ruben scales to form an eight-item Behavioral Assessment Scale for Intercultural Communication effectiveness are described. Results of the administration of the BASIC measure to 263 college students demonstrated that the new scale was reliably used, correlated highly with another measure of communication effectiveness, and represented one underlying dimension. Limitations of the scale and suggestions for additional research are presented.\nRésumé\nEn vue de développer l'Echelle evaluative des comportements pour l'efficacité de la commuication interculturelle (BASIC), cette expérience utilise comme base théorique et méthodologique l'approche béhavioriste représentée par le test de l'efficacité' de la communication interculturelle (Ruben, 1976). En plus de signaler les points forts conceptuels et les faiblesses méthodologiques de cette approche, ce rapport résine les travaux de Ruben et de ses collègues (Ruben, 1976; Ruben, 1985; Ruben, Askling & Kealey, 1979). Pour en arriver à une Echelle évaluative des comportements pour l'efficacité de la communication interculturelle à huit articles, l'expérience apporte certaines modificatiotis aux neuf échelles établies originairement par Ruben. A en juger par les résultats du test BASIC, qui fut donne' à 263 étudiants d'université', la nouvelle échelle est valable, correspond bien à un autre test de l'efficacité' de communication, et représente une des dimensions fondamentales. Oe rapport se clôt par l'analyse des limitations de cette échelle et par des suggestions de recherches ultérieures, (author-supplied abstract)\nResumen\nEl método de observación de la conducta para medir los resultados de la comucación intercultural (Ruben, 1976) es empleado como la base teórica y metodológica para el desarrollo de la escala de evaluatión (del comportamiento) de la conducta para medir la eficada de la commicacíon intercultural (BASIC). El ensayo (el articulo) describe el trabajo anterior de Ruben y sus colegas (Ruben, 1976; Ruben, 1935; Ruben, Askling & Kealey, 1979). Asimismo presenta tanto los aciertos conceptuales como las debiladades metodológicas de esta propuesta. Se han descrtio las modificaciones hechas a las nueve escalas originales de Ruben para formar las ocho partes de la escala de evaluadón de la conducta para medir la comunicación intercultural. Los resultados de la aplicación del patrón (de la medida) BASIC a 263 estudiantes universitarios ha demonstrado que la nueva escala fue usada con confidencia, que se relaciona efectivamente con otros sistemas de evaluación de la eficacia de la communicación y finalmente que représenta una dimensión fundamental. Tanto las limitaciones de la escala como sugerencias para subsecuentes investigaciones también han sido presentadas. (author-supplied abstract)"
