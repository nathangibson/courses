- id: smithTheoreticalLandscapeIntercultural2025a
  abstract: The second of a two-part chapter surveying the theoretical landscape of intercultural communication examines the proliferation of paradigmatic and theoretical perspectives over the past several decades. This chapter provides an overview of current intercultural communication theories within three social-interpretive-holistic paradigms that are used to explain intercultural phenomena. The chapter provides summaries of selected theories, highlighting key assumptions for the latest versions of established theories. Theoretical conversations in these traditions reflect the broader societal trends of philosophical and methodological dysphoria amidst questions pertaining to historical conceptualisations, hegemonic perspectives, and new postcolonial and Global South understandings that call for reconceptualisation of key terms and an embrace of previously marginalised voices. The prospect for increasingly interdisciplinary, innovative, and insightful theoretical conversations hints that the mesh of our theoretical landscape is becoming ever finer.
