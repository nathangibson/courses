- id: bierbrauerg.COSCulturalOrientation2002
  abstract: 'The COS can be used to show differences in individualism/collectivism both between individuals and groups within a culture/country and between different cultures/countries. It can also differentiate between perceived cultural norms on the one hand and their individual evaluations on the other. It was based on the items of the INDCOL scale by Hui (1988) and two scales by Sinha and Verma (1987). The COS consists of two questionnaire parts with 13 items each. Reliability: Internal consistencies of Cronbach''s Alpha = .59-.82 are reported from different cultural contexts. Validity: In the two German studies, both the scales and the individual items were able to differentiate between immigrants and asylum seekers on the one hand and Germans on the other. The differences between the two immigrant groups were not significant. A further study revealed significant differences between German and Korean students. Furthermore, in comparative cultural studies in different cultures/countries, the COS was able to differentiate significantly between participants from more collectivistically and more individually oriented cultures. Further findings show connections between the collectivist orientation recorded with the COS and the perceived social support after stressful events as well as with processes of social influence.'
