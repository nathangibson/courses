- id: braunGenderroleAttitudesISSP1999
  abstract: "Due to their importance for any\nsociety, gender-role attitudes have been included in surveys of special groups\nand the entire population for several decades. In accordance to the changed\nopportunity structure, behavior of women changed, too. The question was then\nwhether the changed opportunity structure for women, their changed behavior and\nthe women's movement had also produced changes in attitudes. The documented\nitems acquire gender-role attitudes in three dimensions. The Consequence\ndimension (C), the Gender-role ideology dimension (G) and the Economic\nconsequences dimension (E). The first and the second dimension include four\nitems while the last dimension includes three."
