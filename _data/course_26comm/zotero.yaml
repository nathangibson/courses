- id: leongUnderstandingPluralisticSocieties2025
  abstract: Acculturation and communication are dynamic processes that shape social identity and outcomes of intercultural contact. Acculturation is a process where individuals negotiate their identity and cultural engagement in a dissimilar environment. The outcome is determined by the individual's socio-ecological background, sense of belonging, and their relations with members of the host society. Intercultural communication, on the other hand, examines how we communicate with members of majority and minority cultures, and how the dialectical exchange leads to improved socio-psychological health and the development of an intercultural identity. Intercultural communication and acculturation are iterative and reciprocal, and are both influenced by the changing socio-political contours of our times. This chapter will address the contextual factors, socio-cognitive processes, individual differences, and intergroup conditions that affect contact outcomes. The two processes offer a holistic overview of how ethnocultural diversity can be navigated in plural societies and in a world that is increasingly divided and polarised.
