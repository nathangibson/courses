- id: kokemohrEntwicklungszusammenarbeit2007
  abstract: ›Interkulturelle Kommunikation‹ und ›interkulturelle Kompetenz‹ sind längst zu Schlagworten geworden, mit denen moderne Gesellschaften zentrale praktische Herausforderungen und wichtige Aspekte ihres Selbstverständnisses auf den Begriff zu bringen versuchen. Dabei steht der Ausdruck ›interkulturelle Kommunikation‹ vorwiegend für Verständigungsschwierigkeiten, die in ganz verschiedenen Lebensbereichen und Berufsfeldern kontinuierlich zunehmen. Kulturelle Unterschiede gelten in dieser Sicht als beinahe unerschöpfliche Quelle von Problemen kommunikativer Verständigung, praktischer Kooperation und Koexistenz. Bisweilen werden sie sogar als ein Risiko betrachtet, das die Auftretenswahrscheinlichkeit gewaltsam ausgetragener sozialer Konflikte erhöht. Die Rede von ›interkultureller Kompetenz‹ signalisiert komplementär das Erfordernis und zugleich das Potential, die diagnostizierten (oder prognostizierten) Schwierigkeiten anzugehen, zu bearbeiten oder von vorneherein zu vermeiden.
