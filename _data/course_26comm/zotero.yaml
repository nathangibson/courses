- id: emmerichZusammenhaltKrisenzeitenJuedischmuslimische2026
  abstract: In zwölf Freundschaftsporträts dokumentiert die Studie Beispiele gelebten Zusammenhalts zwischen Jüdinnen, Juden und Muslim:innen in Frankfurt am Main und der Rhein-Main-Region. Die Porträts erzählen von Nachbar:innen im Frankfurter Bahnhofsviertel, von Eltern auf dem Fußballplatz, von Wissenschaftler:innen, Künstler:innen, Politiker:innen und Aktivist:innen. Gemeinsam ist ihnen die Erfahrung, dass Vertrauen dort wächst, wo Menschen sich nicht zuerst als Vertreter ihrer Religion oder Herkunft begegnen, sondern als Kolleg:innen, Vereinsmitglieder oder Nachbarinnen und Nachbarn. So können persönliche Beziehungen gesellschaftliche Polarisierung abfedern.
