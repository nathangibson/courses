- id: merkinRelationshipIndividualismCollectivism2015
  abstract: This study examines how individualism and collectivism impact the need for consultation versus harmony respectively and whether they underlie direct and indirect communication during face-threatening situations. A MANCOVA design was employed testing individualism/collectivism, while controlling for social desirability, on consultation expectations and harmonious facework strategies from self-report questionnaires (n = 654) collected in the Chile, Hong Kong, Israel, Japan, Sweden, and the United States. Linear regression results show a direct link between individualism and consultation needs and collectivism and harmony needs indicating that when individualists’ face is threatened, they need to be consulted directly about the situation at hand, while face-threatened collectivists need to be treated with harmonious (indirect) communication to manage their face.
