- id: olebeExploringCrossculturalEquivalence1989
  abstract: "Using Hui and Triandis's model of types of cross-cultural equivalence, the Behavioral Assessment Scale for Intercultural Communication (BASIC), an eight-item measure of intercultural communication competence is tested for its cross-cultural equivalence. The conceptual/functional equivalence of BASIC is logically argued from its sound theoretical foundation. Construct operationalization equivalence was tested by examining the factor structure of responses to BASIC by U.S. students and non-U.S. students. Item equivalence was examined by analysis of variance with degree of intercultural exposure in living situation as the independent variable and the absolute difference score between roommate pairs on each of the BASIC items and total score as dependent variables. A regression analysis to determine predictors among the eight items to an additional one item measure of communication effectiveness for U.S. students and non-U.S. students was done to test scalar equivalence. Results indicate preliminary support for BASIC's conceptual, construct operationalization and item equivalence. While the regression analysis produced equivocal results, several explanations are offered. Suggestions for future work to address the scale's equivalence are offered and the need to differentiate between cross-cultural and intercultural equivalence is discussed.\nRésumé\nUtilisant le mooele de Hui et Trianais des types d'equivalences trans-culturelles, l'echelle d'evaluation au comportement pour la communication interculturelle (Basic), une mesure de huit articles de competence est testee pour son equivalence trans-culturelle. L'equivalence conceptuelle/fonctionelle de BASIC est logiquement debatue de sa base theoretique solide. L'equivalence concept d'operationalite de BASIC a ete testee en examinant la structure de facteur des reponses a BASIC par etudiants americains et non-americains. L'equivalence d'article a ete examinee par l' analyse de la discorde avec le degre d' interculturabilite de situation de vivre comme la variable independente et la difference absolue de marque entre paires de camarades de chambre cans chacun des atricles de BASIC et la marque totale comme les variables dependentes. Une analyse de regression pour determiner les meilleures indicateurs entre les articles de BASIC a un article de plus de mesure de l' efficacite de communication pour etudiants americains et etudiants non-americains a ete realisee pour tester l' equivalence d' echelle. Les resultats indiquent appui preliminaire pour l' equivalence d'article et l'operationalite conceptuelle des idees. Quoique l' analyse de regression ait produit des resultats equivoques, beaucoup d' explanations sont donnees. Les suggestions pour travail dans l' avenir pour addresser l' equivalence de l 'echelle sont donnees aussi bien que la necessite ds distinguer entre l'equivalence trans-culturelle et interculturelle, (author-supplied abstract).\nResumen\nUsando el modele de tipos ds equivaLenci a trans-cultural de Hui y Triandis la escala comportamentista de valoracion para la comunicacion interculteral, (BASIC), una medida de ocho puntos de la competencia de la comunicacion interculteral se pone a prueba para su equivalencia trans-cultural. La equivalencia conceptual/funcional de BASIC se discute logicamente de su bien fundada fundacion teorica. La equivalencia de operacionalizacion conceptualizada de BASIC fue puesta a prueba, examinado la estructura elemental de repuestas a BASIC por estudiantes estadounidenses y estudiantes extranjeros. La equivalencia de detalle fue examinada por medio de analisis del desacuerdb con la eficia de interculteral idad de situacion de vivir camo la variable independiente y la puntacion de diferencia absoluta entre parejas de companeros de cuarto en cada de las preguntas en BASIC, y la puntacion total cano las variables dspendientes. un analisis de regresicn para detenninar los mejores pcognostioos entre los detalles de BASIC, para ina medida de un detalle adicional de la eficada de onniJu.caa.on para estudiantes estadDinidenses y estudiantes extranjeros fue hecho para poner a pcueba la equivalencia escalar. Los resultadss indican apoyo preliminar para la operacionalizacion conceptualizada y la equivalencia de detalle. Aunque el analisis de regresion pcodujera resultados equivocos, varias explanations se ofreon. Sugerencias para trabajo futuro para aplicarse a la equivalencia de la escala se ofreen tan bien camo la neoesidad de distingua, r entre la equivalencia trans-cultural y la intercultural. (author-supplied abstract)."
