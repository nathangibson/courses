- id: bluemkeSupernaturalBeliefScale2017
  abstract: "The 10-item scale measures the\ntendency to believe in supernatural entities such as immaterial agents, afterlife/otherworld\nplaces, and miraculous earthly events. The scale is intended to be a valid\nindicator of the cognitive component of religiosity, capturing ten\ncross-cultural beliefs that appear as religious themes in various religious\ncontexts in the world. The scale was first tested in English by Jong, Bluemke,\n&amp; Halberstadt (2013). The SBS aims to be applicable to people of different\nreligious standing (atheists and believers alike), across various countries,\nwith a multitude of religious backgrounds, if necessary by adapting the labels\npertaining to the supernatural entities, while not altering the essence of the\nitem content or response format. After its seminal application in New Zealand,\nand later in Croatia, among student samples with mostly a Christian cultural background,\nit was applied in Germany, yielding good reliability, a replicable factor\nstructure, and cross-cultural measurement invariance (strict invariance across\nGermans and New Zealanders). The scale showed signs of construct validity and\ncriterion validity in all samples (NZ, CRO, GER)."
