- id: rathjeInterkulturelleKompetenzZustand2006
  abstract: Der Artikel beschreibt den Forschungsstand zum Konzept Interkulturelle Kompetenz anhand der Darstellung und Bewertung des Spektrums unterschiedlicher Definitionsansätze in der deutschsprachigen Debatte. Hierzu wird exemplarisch die Diskussion um einen Überblicksartikel zum Thema interkulturelle Kompetenz des Psychologen Alexander Thomas untersucht, der in mehr als dreißig Stellungnahmen von Wissenschaftlerinnen und Wissenschaftlern aus unterschiedlichen Disziplinen kommentiert wurde. Auf Basis dieser Zustandsanalyse werden Anforderungen an ein zeitgemäßes Verständnis interkultureller Kompetenz abgeleitet und Vorschläge für eine mögliche Weiterentwicklung des Konzepts auf der Grundlage eines kohäsionsorientierten Kulturverständnisses entwickelt.
