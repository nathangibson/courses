- id: popp-baierReligion2007
  abstract: Interkulturelle Beziehungen und Begegnungen, Vorstellungen vom ›Fremden‹ und ›Eigenen‹ sowie damit verbundene Verständigungsverhältnisse sind seit jeher Bestandteile menschlicher Gruppen und Kulturen. Austausch- und Kommunikationsbeziehungen stellen den »Normalfall kultureller Entwicklung« dar (Daniel 2004, 239). Tausch-, Handels- und Heiratsbeziehungen, religiöse Verbindungen und andere, teils auch weniger freundliche Interaktionen und Bewegungen über lokale und ethnische Grenzen hinweg, führten, wie Fredrik Barth bereits in den 60er Jahren des 20. Jahrhunderts darlegte, nicht zur Auflösung kultureller Differenzen, sondern brachten oftmals gar eine Festigung ethnischer und kultureller Identitäten und Grenzziehungen mit sich (Barth 1969, 13). Wie kommt es also, dass heute häufig angenommen bzw. befürchtet wird, die Welt werde durch Globalisierung kulturell vereinheitlicht, oder aber sie teile sich in wenige große, einander feindlich gegenüber stehende Zivilisationen auf?
