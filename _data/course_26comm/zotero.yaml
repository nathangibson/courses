- id: maehlerAkkulturationsorientierungBeiMigrantinnen2018
  abstract: "Akkulturation ist ein breit gefasstes\nKonzept, das sich auf Veränderungen bezieht, die in Folge eines\ninterkulturellen Kontaktes eintreten. Rudmin (2009) fasst Akkulturation zum\nBeispiel als die Aneignung einer zweiten Kultur zusammen. Die Skalen zur\nErfassung der Akkulturationsorientierung von Migrantinnen und Migranten (AKOrM)\nerfassen, inwiefern das Verhaltensrepertoire sich an der deutschen Kultur bzw.\nHerkunftskultur orientiert. Dabei wird von einem bidimensionalen Modell\nausgegangen, in dem der Akkulturationsprozess auf zwei Dimensionen stattfindet:\nDie Beibehaltung der Herkunftskultur bzw. die Anpassung an die Aufnahmekultur\nkönnen unabhängig voneinander stattfinden. Bei den Skalen zur\nAkkulturationsorientierung handelt es sich um eine deutsche Adaptation des Vancouver\nIndex of Acculturation von Ryder, Alden und Paulhus (2000)."
