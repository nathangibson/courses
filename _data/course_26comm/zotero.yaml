- id: tenthijeWhatInterculturalCommunication2020
  abstract: Jan D ten Thije addresses the spectrum of scientific and societal issues referred to as intercultural communication by pointing out five different theoretical and methodical approaches. First, he discusses the interactive approach which investigates intercultural (face-to-face) interaction. He then focuses on approaches that compare and contrast cultural and linguistic systems, before discussing those that consider collective and national images of ‘self’ and ‘other’ by analysing cultural representations in various forms of (computer-mediated) communication. A fourth approach comprises studies into multilingualism and linguistic diversities, and finally, the transfer approach integrates knowledge, attitudes, capacities, reflectivity and motivation in learnable intercultural competencies. Ten Thije elaborates on the interfaces and interrelations of these approaches in how they address the notion of ‘intercultural mediation’.
  accessed:
    - year: 2026
      month: 10
      day: 14
