- id: ShockSavageEdward2015
  abstract: Edward Burnett Tylor scarcely mentioned the term Natural Religion, yet he sought the first religion or the origins of religion. Both Tylor and Hume saw the first religion — animism or polytheism — as a kind of rational projection of the ordinary experience of powerful people onto a supernatural realm. Spiritualism was, in effect, a kind of animism because it held that the disembodied souls of the deceased could make contact with the living. In his article “The Religion of the Savages”, Tylor explains why he thinks some so-called “primitive” peoples might have thought that the life-force inside us is somehow related to breath. Anthropology was nonetheless for Tylor, as it was for Charles Darwin, a branch of natural history, thus making Tylor a Darwinian in the relatively weak sense that he felt that human cultural evolution proceeded in a lawful and natural way. Human nature was something fundamentally universal, constant, and invariant.
