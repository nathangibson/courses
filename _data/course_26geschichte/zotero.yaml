- id: hessischerrundfunkPierreBourdieuFeinen2012
  abstract: "Dokumentation des Hessischen Rundfunks vom 3.11.1983 über den französischen Sozialphilosophen Pierre Bourdieu (+ 2002). \nBourdieus Analyse des kulturellen Konsums und des Kunstgeschmacks der Ober-, Mittel- und \"Volksklasse\" (classe populaire) ist trotz der Anforderungen, die sie stellt, für alle von Interesse, die ihre eigenen, meist als selbstverständlich aufgefassten kulturellen Vorlieben und Praktiken überprüfen möchten. Der Reiz seiner Theorie liegt darin, dass er strikt phänomenologisch vorgeht und immer im Kontakt zum konkreten Alltag bleibt. Besonders charmant ist Bourdieus  Hommage an sein großes Vorbild Norbert Elias und dessen \"Prozess der Zivilisation\"."
