- id: reyBourdieuReligionImposing2014
  abstract: 'Pierre Bourdieu was one of the most influential social theorists of our time. He developed a series of concepts to uncover the way society works and to challenge assumptions about what society is. His ideas illuminate how individuals and groups find value and meaning and so have rapidly come to be seen as hugely productive in analysing how religion works in society. ''Bourdieu on Religion'' introduces students to Bourdieu''s key concepts: cultural, social and symbolic capital; habitus and field; and his challenge to the structures of social inequality. This study will be invaluable to any student interested in the relationships between religion, class and social power.'
