- id: bourdieuGeneseStructureChamp1971
  abstract: 'Pierre Bourdieu : Entstehung und Struktur des religiosen Gebietes. Die Soziologie der Religion und — allgemein gesehen die Soziologie der Ideologien — wird beherrscht vom Gegensatz einerseits zwischen der Tradition, die die Religion als ein Kommunikations — und Wissensinstrument ansieht — das heisst, als ein strukturiertes und strukturierendes System — und anderseits der Tradition, die die politischen Funktionen der religiosen Ideologie unter- streicht. In Wirklichkeit erfüllt die Religion nur insofern eine politische Funktion der Verewigung der Strukturen — das heisst die Absolutisierung des Relativen und die Legitimation des Willkurlichen und dadurch die Zähmung der Beherrschten — als sie eine logische Funktion erfüllt, indem sie dem Denken ihre Strukturen auferlegt.'
