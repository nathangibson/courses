- id: fursethReligionWorksHabermas
  abstract: This article discusses how the theoretical perspectives of Jürgen Habermas, Pierre Bourdieu, and Michel Foucault may illuminate studies of religion. Although these contemporary social and cultural theorists have not written extensively on religion, it does appear as a theme in their work. Their conceptual tools are also used more generally in studies of religion, which call for attention to these theorists by sociologists of religion. The discussion presents Habermas's, Bourdieu's, and Foucault's critiques of religion, before looking at the possible implications that their theories may have for understanding religion in present-day society. It suggests that their ideas are important particularly for the insights they provide into the links between religion and power.
