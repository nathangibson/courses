- id: anettekolbMaxWeberEntzauberung2006
  abstract: "Leben und Werk des Sozialwissenschaftlers Max Weber.\n„Die zunehmende Intellektualisierung und Rationalisierung bedeutet also nicht eine zunehmende allgemeine Kenntnis der Lebensbedingungen, unter denen man steht. Sondern sie bedeutet etwas anderes: das Wissen davon oder den Glauben daran: daß man, wenn man nur wollte, es jederzeit erfahren könnte, daß es also prinzipiell keine geheimnisvollen unberechenbaren Mächte gebe, die da hineinspielen, daß man vielmehr alle Dinge – im Prinzip – durch Berechnen beherrschen könne. Das aber bedeutet: die Entzauberung der Welt. Nicht mehr, wie der Wilde, für den es solche Mächte gab, muss man zu magischen Mitteln greifen, um die Geister zu beherrschen oder zu erbitten. Sondern technische Mittel und Berechnung leisten das. Dies vor allem bedeutet die Intellektualisierung als solche.\""
