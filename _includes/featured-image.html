{% assign image = include.image | default: page.image %}
<div class="featured-image">
    <figure>
      <img src="{{ site.baseurl }}/assets/img/{{ image }}" />
      <figcaption>
        {% assign attr_file = "attributions/" | append: image | append: "-attribution.md" %}
        Image: {% capture image_attribution %}{% include {{ attr_file }} %}{% endcapture %} {{ image_attribution }}
      </figcaption>
    </figure>
</div>
